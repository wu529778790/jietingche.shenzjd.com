name: 校验

# 部署已经搬到本地：`npm run deploy`（见 scripts/deploy.sh）。
#
# 为什么不在 CI 里部署：
#   - GitHub runner 在境外，到国内广州服务器实测上行只有 ~30KB/s：推 80MB 镜像要
#     45 分钟，拆层后 19MB 也要 15 分钟以上；
#   - 反过来让服务器拉 GHCR 同样不行，32 分钟拉不完直接失败；
#   - registry-mirrors 只对 docker.io 生效，救不了 GHCR，换国内中转 registry 也只是
#     把「谁跨境」换个方向，字节数没变，管道还是 30KB/s。
#   - Mac 和服务器都在国内，同一份产物几秒钟就同步完，所以构建 + 传输 + 切换
#     全部放在本地，CI 只保留「代码能不能通过类型检查/lint/构建」这一层校验。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 纯校验，旧的可以放心取消，省分钟数
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 + lint + 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      # 构建期不需要数据库：数据都在运行时读本地 SQLite（见 src/lib/db.ts）。
      # 注意首页 HomeLinks 用 connection() 钉在运行时渲染，构建期拿不到数据也不会
      # 把空壳固化进产物——否则线上首页会变成零站内链接的空页面。
      - name: 生产构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
