name: Build & Deploy

# 单链路：校验 → 构建镜像推 Docker Hub → 服务器拉取换容器。
#
# 为什么是 Docker Hub 而不是 GHCR / 国内 registry：
#   - 服务器在腾讯云广州，daemon.json 已配 mirror.ccs.tencentyun.com，
#     docker.io 的镜像走这条内网加速通道，实测 136MB 只要 3 秒；
#   - 而 GHCR 没有国内加速生态，服务器直连实测 32 分钟拉不完；
#   - 国内 registry（TCR/ACR）能拉但不能推——CI 出海只有 ~30KB/s，
#     推 80MB 要 45 分钟，那是这条链路上唯一走过不去的坎。
#   - 推 Docker Hub 是「境外机房 → 境外机房」，实测 25 秒量级，完全没问题。
#   关键：两个方向都不再跨境，所以链路成立。
#
# 镜像必须是 public（加速器只代理公开镜像，私有只能直连 docker.io 就慢了）。
# 镜像里只有编译产物；TURSO_* / ADMIN_PASSWORD 等运行时配置通过 data/.env
# 以 --env-file 注入，不进镜像。
#
# 数据库在 Turso（远程 libsql），容器无状态：
#   - 容器里不落任何业务数据，需要持久化的只有 data/uploads，挂到 /app/public/uploads。
#   - 所有落盘文件都收在站点目录的 data/ 下（1Panel 备份站点时一起带上）：
#       <SITE_DIR>/data/.env     配置，chmod 600
#       <SITE_DIR>/data/app.db   业务库（本地 SQLite）
#       <SITE_DIR>/data/uploads  上传目录，chown 1001
#
# 需要的 secrets：
#   DOCKERHUB_USERNAME   Docker Hub 用户名（Docker ID，不是邮箱）
#   DOCKERHUB_TOKEN      账号密码或 access token
#   DEPLOY_HOST          服务器地址
#   DEPLOY_USER          SSH 用户
#   DEPLOY_PASSWORD      SSH 密码
#   DEPLOY_PORT          SSH 端口，可选（默认 22）
#   DEPLOY_SITE_DIR      站点目录，可选
#   APP_PORT             对外端口，可选
#   TURSO_DATABASE_URL / TURSO_AUTH_TOKEN / ADMIN_PASSWORD  首次生成 .env 用

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_env:
        description: 用 GitHub secrets 重写服务器上的 .env（默认只在文件不存在时生成）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同一时间只跑一条，避免两次 push 抢着换容器；
  # 不 cancel 正在跑的那条——部署脚本跑到一半被打断会留下「旧容器已删、新容器没起」
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/jietingche

jobs:
  verify:
    name: 类型检查 + lint + 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      # 构建期不需要数据库：数据都在运行时读本地 SQLite（见 src/lib/db.ts）。
      # 注意首页 HomeLinks 用 connection() 钉在运行时渲染，构建期拿不到数据也不会
      # 把空壳固化进产物——否则线上首页会变成零站内链接的空页面。
      - name: 生产构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build:
    name: 构建并推送镜像
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: 检查必需 secret
        run: |
          for name in DOCKERHUB_USERNAME DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::缺少 secret $name"
              exit 1
            fi
          done
          echo "必需 secret 已配置"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SITE_DIR: ${{ secrets.DEPLOY_SITE_DIR }}
          APP_PORT: ${{ secrets.APP_PORT }}
          REFRESH_ENV: ${{ inputs.refresh_env || 'false' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_SITE_DIR,APP_PORT,REFRESH_ENV
          command_timeout: 30m
          script: |
            set -eu
            # 按 commit sha 拉，不认 latest：中转/推送失败时 latest 还停在上一次构建，
            # 按 latest 拉会静默部署旧版本。
            IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            CONTAINER="jietingche"
            # 站点目录跟着 1Panel 走：1Panel 备份/迁移站点时会一起带上 data/
            SITE_DIR="${DEPLOY_SITE_DIR:-/opt/1panel/www/sites/jietingche.shenzjd.com}"
            DATA_DIR="$SITE_DIR/data"
            ENV_FILE="$DATA_DIR/.env"
            UPLOADS_DIR="$DATA_DIR/uploads"
            APP_PORT="${APP_PORT:-3000}"
            PRECHECK="${CONTAINER}-precheck"

            # 镜像公开，不需要登录；docker.io 由 daemon.json 的
            # mirror.ccs.tencentyun.com 走腾讯云内网加速（实测百 MB 级几秒）。
            echo "=== 拉取镜像 $IMAGE ==="
            sudo docker pull "$IMAGE"

            echo "=== 准备数据目录 $DATA_DIR ==="
            sudo mkdir -p "$UPLOADS_DIR"
            # 容器里以 nextjs(1001) 运行，上传目录得让它可写
            sudo chown -R 1001:1001 "$UPLOADS_DIR"
            # 业务库是宿主机上的 SQLite 文件，挂到容器 /app/data。
            # 目录本身要可写：SQLite 要在同目录落 -wal/-journal。
            sudo chown 1001:1001 "$DATA_DIR"
            if [ ! -s "$DATA_DIR/app.db" ]; then
              echo "❌ 缺少 $DATA_DIR/app.db（本地 SQLite 业务库），中止部署避免上线空白站"
              echo "   在本地跑：npm run db:pull，再 scp data/app.db <user>@<host>:$DATA_DIR/app.db"
              exit 1
            fi
            sudo chown 1001:1001 "$DATA_DIR/app.db"
            echo "业务库 $(du -h "$DATA_DIR/app.db" | cut -f1)"

            if ! sudo test -f "$ENV_FILE" || [ "${REFRESH_ENV:-false}" = "true" ]; then
              echo "生成 $ENV_FILE（来自 GitHub secrets，refresh=${REFRESH_ENV:-false}）"
              {
                echo "TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}"
                echo "TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}"
                echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
                echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || '*' }}"
                echo "JTC_SHARE_CODE=${{ secrets.JTC_SHARE_CODE }}"
              } | sudo tee "$ENV_FILE" >/dev/null
            fi
            sudo chmod 600 "$ENV_FILE"

            echo "=== 环境自检：本地业务库能不能读 ==="
            # 先验一遍「读得到 + 有数据」，免得把空库/无权限的目录带上线
            # （那会是全站空白，比 500 更难查）。
            if ! sudo docker run --rm -v "$DATA_DIR:/app/data" "$IMAGE" node -e '
              const { createClient } = require("@libsql/client");
              const c = createClient({ url: "file:/app/data/app.db" });
              c.execute("select count(*) n from car_parks")
                .then((r) => {
                  const n = Number(r.rows[0].n);
                  console.log("car_parks", n);
                  if (!n) {
                    console.log("空库：先把 data/app.db 传上来");
                    process.exit(1);
                  }
                })
                .catch((e) => {
                  console.log("DB ERROR", e.message);
                  process.exit(1);
                });
            '; then
              echo "❌ 本地库自检未通过：检查 $DATA_DIR/app.db 是否存在、内容是否为空、权限是否给了 1001"
              exit 1
            fi

            run_container() {
              sudo docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                -p "$APP_PORT:3000" \
                -v "$UPLOADS_DIR:/app/public/uploads" \
                -v "$DATA_DIR:/app/data" \
                --env-file "$ENV_FILE" \
                --memory 768m \
                --cpus "2.0" \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                "$1"
            }

            # 容器内探活：/api/config 是公开接口，能起服务就一定回 200
            health() {
              sudo docker exec "$1" node -e \
                "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                >/dev/null 2>&1
            }

            wait_healthy() {
              i=0
              while [ "$i" -lt 45 ]; do
                health "$1" && return 0
                i=$((i + 1)); sleep 1
              done
              return 1
            }

            echo "=== 预检：新镜像先起临时容器（不占对外端口） ==="
            sudo docker rm -f "$PRECHECK" >/dev/null 2>&1 || true
            # 用业务库的副本做预检：既验证真实数据能读，又不让临时容器和线上容器
            # 同时打开同一个 SQLite 文件（DDL/写锁会互相干扰）。
            PRECHECK_DIR=$(mktemp -d)
            sudo cp "$DATA_DIR/app.db" "$PRECHECK_DIR/app.db"
            sudo chown -R 1001:1001 "$PRECHECK_DIR"
            sudo docker run -d --name "$PRECHECK" -v "$PRECHECK_DIR:/app/data" --env-file "$ENV_FILE" "$IMAGE" >/dev/null
            if ! wait_healthy "$PRECHECK"; then
              echo "❌ 预检失败，旧容器未动。最近日志："
              sudo docker logs --tail 60 "$PRECHECK" || true
              sudo docker rm -f "$PRECHECK" >/dev/null 2>&1 || true
              sudo rm -rf "$PRECHECK_DIR"
              exit 1
            fi
            sudo docker rm -f "$PRECHECK" >/dev/null
            sudo rm -rf "$PRECHECK_DIR"
            echo "预检通过"

            echo "=== 记录回滚镜像 ==="
            CUR_ID=$(sudo docker inspect -f '{{.Image}}' "$CONTAINER" 2>/dev/null || true)
            if [ -n "$CUR_ID" ]; then
              sudo docker tag "$CUR_ID" jietingche:previous && echo "回滚镜像：jietingche:previous"
            else
              echo "无运行中的旧容器（首次部署）"
            fi
            sudo docker tag "$IMAGE" jietingche:latest

            echo "=== 换容器 ==="
            sudo docker stop "$CONTAINER" >/dev/null 2>&1 || true
            sudo docker rm "$CONTAINER" >/dev/null 2>&1 || true
            if ! run_container jietingche:latest; then
              echo "❌ 新容器启动失败"
              if sudo docker image inspect jietingche:previous >/dev/null 2>&1; then
                echo "回滚到 jietingche:previous"
                sudo docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
                run_container jietingche:previous || { echo "❌ 回滚也失败，需人工介入"; exit 1; }
              fi
              exit 1
            fi

            echo "=== 自检 ==="
            if ! wait_healthy "$CONTAINER"; then
              echo "❌ 新容器未通过探活，最近日志："
              sudo docker logs --tail 60 "$CONTAINER" || true
              echo "   回滚命令：sudo docker rm -f $CONTAINER && sudo docker run -d --name $CONTAINER ... jietingche:previous"
              exit 1
            fi

            echo "=== 清理悬空镜像（保留 latest / previous 便于回滚） ==="
            sudo docker image prune -f >/dev/null

            echo "=== 部署完成 ==="
            sudo docker ps | grep "$CONTAINER"

            # 宿主机端口自检：容器内探活过了，不代表 -p 映射和防火墙放行了
            echo "=== 宿主机端口自检（$APP_PORT -> 3000） ==="
            HOST_CODE=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "http://127.0.0.1:$APP_PORT/api/config" || echo "000")
            if [ "$HOST_CODE" = "200" ]; then
              echo "宿主机 $APP_PORT 对外映射正常"
            else
              echo "⚠️ 宿主机 $APP_PORT 返回 $HOST_CODE：映射或防火墙/安全组需人工确认"
              sudo docker port "$CONTAINER" || true
            fi

            # 落地页缓存护栏：SEO 三页必须始终可被 CDN 缓存。
            # 病根：页面一旦引入请求级依赖（cookies/searchParams），Next 会无声下发
            # private,no-store，CDN 缓存整个失效且没有任何报错，只有回源变慢。
            # 首页走 connection() 运行时渲染，首次请求要等 DB 查询，这里给足超时。
            echo "=== 落地页缓存头断言（防 no-store 回归） ==="
            CITY_ASSERT=$(curl -s -m 30 "http://127.0.0.1:$APP_PORT/" \
              | grep -o 'href="/city/[^"]*"' | head -1 | cut -d'"' -f2)
            PARK_ASSERT=$(curl -s -m 30 "http://127.0.0.1:$APP_PORT$CITY_ASSERT" \
              | grep -o 'href="/park/[^"]*"' | head -1 | cut -d'"' -f2)
            for p in "/" "$CITY_ASSERT" "$PARK_ASSERT"; do
              if [ -z "$p" ]; then
                echo "❌ 未能解析出落地页链接（首页没给 /city/ 或城市页没给 /park/）"
                exit 1
              fi
              cc=$(curl -s -o /dev/null -D - -m 30 "http://127.0.0.1:$APP_PORT$p" \
                | tr -d '\r' | grep -i '^cache-control:' | head -1)
              case "$cc" in
                *s-maxage*)
                  echo "✓ $p → $cc"
                  ;;
                *)
                  echo "❌ $p 缓存头不含 s-maxage：$cc（页面被改回动态渲染，CDN 会全量回源）"
                  exit 1
                  ;;
              esac
            done
