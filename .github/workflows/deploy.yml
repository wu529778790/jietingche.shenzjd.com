name: Build & Deploy

# 单链路：校验 → 构建镜像（GHCR + 境内中转双推）→ 服务器拉取 → 换容器。
#
# 为什么是「CI 构建镜像」而不是「传源码上去本机 build」：
#   - 这台应用带 Next + Tailwind 整套构建，服务器本机 build 会吃满 CPU/内存，
#     而镜像构建放在 CI 上跑不影响线上；服务器只做 pull + run。
#
# 为什么镜像要经「境内中转 registry」：
#   - 广州服务器直连 ghcr.io 会被跨境网络掐断，大层反复重试拉不完（真踩过 32min）。
#     registry-mirrors 只对 docker.io 生效救不了 GHCR；镜像包私有，公共加速源
#     也代理不了。
#   - 也试过「CI save + rsync 直传」（境外 runner → 广州），实测跨境上行不到
#     1 Mbps，80 MB 的包 17 分钟传不完，同样不能用。
#   - 所以改成 CI 双推：GHCR 保底 + 境内 registry（阿里云 ACR / 腾讯云 TCR）做
#     主通道。服务器从境内拉 80 MB 是秒级，只有中转没配或拉失败才回退 GHCR。
#
# 数据库在 Turso（远程 libsql），容器无状态：
#   - 容器里不落任何业务数据，需要持久化的只有 data/uploads，挂到 /app/public/uploads。
#   - 所有落盘文件都收在站点目录的 data/ 下（1Panel 备份站点时一起带上）：
#       <SITE_DIR>/data/.env     配置，chmod 600
#       <SITE_DIR>/data/uploads  上传目录，chown 1001
#   - TURSO_* 与 ADMIN_PASSWORD 通过 data/.env 注入（--env-file），不进镜像；
#     首次部署若 .env 不存在，会用 GitHub secrets 生成一份。
#
# 首次启用前要在仓库 Settings → Secrets and variables → Actions 配好：
#   DEPLOY_HOST          服务器地址
#   DEPLOY_USER          SSH 用户
#   DEPLOY_PASSWORD      SSH 密码（用密钥的话改成 DEPLOY_SSH_KEY 并换 appleboy 的 key 参数）
#   DEPLOY_PORT          SSH 端口，可省略（默认 22）
#   DEPLOY_SITE_DIR      站点目录，可省略（默认 1Panel 站点目录 jietingche.shenzjd.com）
#   APP_PORT             对外端口，可省略（默认 3000）
#   TURSO_DATABASE_URL   数据库地址
#   TURSO_AUTH_TOKEN     数据库 token
#   ADMIN_PASSWORD       管理后台口令（不配，线上后台会 503）
#
# 镜像中转（强烈建议配，不配就退回跨境直拉 GHCR，一次几十分钟）：
#   REGISTRY_IMAGE       中转仓库完整路径，不含 tag。例：
#                          ccr.ccs.tencentyun.com/jietingche/app                 （腾讯云 TCR 个人版）
#                          registry.cn-guangzhou.aliyuncs.com/jietingche/app      （阿里云 ACR）
#   REGISTRY_USERNAME    腾讯云 TCR：账号 ID（UIN，一串数字，控制台「账号信息」里看）
#                        阿里云 ACR：阿里云账号全名
#   REGISTRY_PASSWORD    控制台里设的「固定登录密码」
#                        （不是 API SecretKey，也不是 1 小时有效的临时密码）
#   注意仓库名必须全小写，且提前在控制台建好命名空间（ACR/TCR 个人版都免费）。
#
# 服务器上只需要：Docker、能访问中转 registry、一个能写的站点目录；
# 只有中转不可用时才会用到 ghcr.io。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_env:
        description: 用 GitHub secrets 重写服务器上的 .env（默认只在文件不存在时生成）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同一时间只跑一条，避免两次 push 抢着换容器；
  # 不 cancel 正在跑的那条——部署脚本跑到一半被打断会留下「旧容器已删、新容器没起」
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 类型检查 + lint + 构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      # 构建期不需要数据库：页面都是客户端组件 / 动态接口，这里不注入 TURSO_*
      - name: 生产构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build:
    name: 构建并推送镜像
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # secrets 不能出现在 step 的 if 里，先落到 job 级 env 才能判断「中转配没配」
    env:
      REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
    steps:
      - uses: actions/checkout@v5

      # 用 step outputs 而不是 GITHUB_ENV：中转 host 要拿来做后续 step 的 if 条件，
      # GITHUB_ENV 写的变量在 env 上下文里不保证可见，outputs 是确定的。
      - name: 计算镜像名
        id: img
        run: |
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          HOST=""
          if [ -n "$REGISTRY_IMAGE" ]; then
            HOST="${REGISTRY_IMAGE%%/*}"
            echo "镜像：$GHCR + 中转 $REGISTRY_IMAGE"
          else
            echo "::warning::未配置 REGISTRY_IMAGE，服务器只能跨境直拉 GHCR（每次可能几十分钟）"
            echo "镜像：$GHCR（无中转）"
          fi
          echo "ghcr=$GHCR" >> "$GITHUB_OUTPUT"
          echo "registry_host=$HOST" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录境内中转
        if: steps.img.outputs.registry_host != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.img.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 GHCR（保底）
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.ghcr }}:latest
            ${{ steps.img.outputs.ghcr }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 中转失败不能拖垮部署：服务器按 sha 拉，拉不到就自动回退 GHCR。
      # 也正因为服务器认 sha 而不是 latest，中转推失败时绝不会误拉上一次的旧镜像。
      - name: 同步推送到境内中转
        if: steps.img.outputs.registry_host != ''
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
    steps:
      - name: 检查必需 secret
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::缺少 secret $name"
              exit 1
            fi
          done
          # 中转只配一半会表现成「拉取 401」，不如在这里直接拦下来
          if [ -n "${REGISTRY_IMAGE:-}" ]; then
            if [ -z "${REGISTRY_USERNAME:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; then
              echo "::error::REGISTRY_IMAGE 已配置，但缺少 REGISTRY_USERNAME / REGISTRY_PASSWORD"
              exit 1
            fi
            echo "镜像中转：$REGISTRY_IMAGE"
          else
            echo "::warning::未配置镜像中转，本次只能跨境直拉 GHCR"
          fi
          echo "必需 secret 已配置"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SITE_DIR: ${{ secrets.DEPLOY_SITE_DIR }}
          APP_PORT: ${{ secrets.APP_PORT }}
          REFRESH_ENV: ${{ inputs.refresh_env || 'false' }}
          REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_SITE_DIR,APP_PORT,REFRESH_ENV,REGISTRY_IMAGE,REGISTRY_USERNAME,REGISTRY_PASSWORD
          command_timeout: 30m
          script: |
            set -eu
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}"
            CONTAINER="jietingche"
            # 站点目录跟着 1Panel 走：1Panel 备份/迁移站点时会一起带上 data/
            SITE_DIR="${DEPLOY_SITE_DIR:-/opt/1panel/www/sites/jietingche.shenzjd.com}"
            DATA_DIR="$SITE_DIR/data"
            ENV_FILE="$DATA_DIR/.env"
            UPLOADS_DIR="$DATA_DIR/uploads"
            LEGACY_SITE_DIR="/opt/jietingche"
            APP_PORT="${APP_PORT:-3000}"
            PRECHECK="${CONTAINER}-precheck"

            # 镜像获取：境内中转优先（秒级），没配或拉不动才回退跨境直拉 GHCR。
            # 两个通道都按本次 commit sha 拉，不认 latest——中转推失败时 latest
            # 还停在上一次构建，按 latest 拉会静默部署旧版本。
            pull_from_ghcr() {
              # login 不带 sudo 会把凭据写进 SSH 用户的 ~/.docker，sudo pull 读的是 /root/.docker
              echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
              sudo docker pull "$IMAGE"
              # 拉完立刻登出：留着这个 job 级 token 会让之后所有 pull 被打成 denied
              sudo docker logout ghcr.io || true
            }
            if [ -n "${REGISTRY_IMAGE:-}" ]; then
              MIRROR_HOST="${REGISTRY_IMAGE%%/*}"
              MIRROR_TAG="$REGISTRY_IMAGE:${{ github.sha }}"
              echo "=== 从境内中转拉取 $MIRROR_TAG（$MIRROR_HOST） ==="
              # login 与 pull 都算一次尝试：密码错也算中转不可用，一样回退
              if echo "$REGISTRY_PASSWORD" | sudo docker login "$MIRROR_HOST" -u "$REGISTRY_USERNAME" --password-stdin \
                && sudo docker pull "$MIRROR_TAG"; then
                IMAGE="$MIRROR_TAG"
              else
                echo "⚠️ 中转不可用，回退跨境直拉 GHCR（可能很慢）"
                pull_from_ghcr
              fi
              sudo docker logout "$MIRROR_HOST" || true
            else
              echo "=== 未配置镜像中转，走跨境直拉 GHCR ==="
              pull_from_ghcr
            fi

            echo "=== 准备数据目录 $DATA_DIR ==="
            sudo mkdir -p "$UPLOADS_DIR"
            # 容器里以 nextjs(1001) 运行，上传目录得让它可写
            sudo chown -R 1001:1001 "$UPLOADS_DIR"
            # 业务库是宿主机上的 SQLite 文件，挂到容器 /app/data。
            # 目录本身要可写：SQLite 要在同目录落 -wal/-journal。
            sudo chown 1001:1001 "$DATA_DIR"
            if [ ! -s "$DATA_DIR/app.db" ]; then
              echo "❌ 缺少 $DATA_DIR/app.db（本地 SQLite 业务库），中止部署避免上线空白站"
              echo "   在本地跑：npm run db:pull && scp data/app.db <user>@<host>:$DATA_DIR/app.db"
              exit 1
            fi
            sudo chown 1001:1001 "$DATA_DIR/app.db"
            echo "业务库 $(du -h "$DATA_DIR/app.db" | cut -f1)"

            # 老版本把 .env / uploads 放在 /opt/jietingche，首次迁过来，别把 DB 配置弄丢
            if [ "$LEGACY_SITE_DIR" != "$SITE_DIR" ] && sudo test -d "$LEGACY_SITE_DIR"; then
              if ! sudo test -f "$ENV_FILE" && sudo test -f "$LEGACY_SITE_DIR/.env"; then
                echo "迁移 $LEGACY_SITE_DIR/.env → $ENV_FILE"
                sudo cp "$LEGACY_SITE_DIR/.env" "$ENV_FILE"
                sudo chown root:root "$ENV_FILE"
              fi
              if sudo test -d "$LEGACY_SITE_DIR/uploads"; then
                echo "迁移旧 uploads 内容"
                sudo cp -rn "$LEGACY_SITE_DIR/uploads/." "$UPLOADS_DIR/" 2>/dev/null || true
                sudo chown -R 1001:1001 "$UPLOADS_DIR"
              fi
            fi

            if ! sudo test -f "$ENV_FILE" || [ "${REFRESH_ENV:-false}" = "true" ]; then
              echo "生成 $ENV_FILE（来自 GitHub secrets，refresh=${REFRESH_ENV:-false}）"
              {
                echo "TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}"
                echo "TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}"
                echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
                echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || '*' }}"
                # 分佣 shareCode：前端拼套餐直达码用，没配就走代码里的兜底值
                echo "JTC_SHARE_CODE=${{ secrets.JTC_SHARE_CODE }}"
              } | sudo tee "$ENV_FILE" >/dev/null
            fi
            sudo chmod 600 "$ENV_FILE"

            echo "=== 环境自检：本地业务库能不能读 ==="
            # 换成本地 SQLite 后，DB 就在挂载卷里。这里先验一遍「读得到 + 有数据」，
            # 免得把空库/无权限的目录带上线（那会是全站空白，比 500 更难查）。
            if ! sudo docker run --rm -v "$DATA_DIR:/app/data" "$IMAGE" node -e '
              const { createClient } = require("@libsql/client");
              const c = createClient({ url: "file:/app/data/app.db" });
              c.execute("select count(*) n from car_parks")
                .then((r) => {
                  const n = Number(r.rows[0].n);
                  console.log("car_parks", n);
                  if (!n) {
                    console.log("空库：先把 data/app.db 传上来");
                    process.exit(1);
                  }
                })
                .catch((e) => {
                  console.log("DB ERROR", e.message);
                  process.exit(1);
                });
            '; then
              echo "❌ 本地库自检未通过：检查 $DATA_DIR/app.db 是否存在、内容是否为空、权限是否给了 1001"
              exit 1
            fi

            run_container() {
              sudo docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                -p "$APP_PORT:3000" \
                -v "$UPLOADS_DIR:/app/public/uploads" \
                -v "$DATA_DIR:/app/data" \
                --env-file "$ENV_FILE" \
                --memory 768m \
                --cpus "2.0" \
                --log-opt max-size=10m \
                --log-opt max-file=3 \
                "$1"
            }

            # 容器内探活：/api/config 是公开接口，能起服务就一定回 200
            health() {
              sudo docker exec "$1" node -e \
                "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                >/dev/null 2>&1
            }

            wait_healthy() {
              i=0
              while [ "$i" -lt 45 ]; do
                health "$1" && return 0
                i=$((i + 1)); sleep 1
              done
              return 1
            }

            echo "=== 预检：新镜像先起临时容器（不占对外端口） ==="
            sudo docker rm -f "$PRECHECK" >/dev/null 2>&1 || true
            # 用业务库的副本做预检：既验证真实数据能读，又不让临时容器和线上容器
            # 同时打开同一个 SQLite 文件（DDL/写锁会互相干扰）。
            PRECHECK_DIR=$(mktemp -d)
            sudo cp "$DATA_DIR/app.db" "$PRECHECK_DIR/app.db"
            sudo chown -R 1001:1001 "$PRECHECK_DIR"
            sudo docker run -d --name "$PRECHECK" -v "$PRECHECK_DIR:/app/data" --env-file "$ENV_FILE" "$IMAGE" >/dev/null
            if ! wait_healthy "$PRECHECK"; then
              echo "❌ 预检失败，旧容器未动。最近日志："
              sudo docker logs --tail 60 "$PRECHECK" || true
              sudo docker rm -f "$PRECHECK" >/dev/null 2>&1 || true
              sudo rm -rf "$PRECHECK_DIR"
              exit 1
            fi
            sudo docker rm -f "$PRECHECK" >/dev/null
            sudo rm -rf "$PRECHECK_DIR"
            echo "预检通过"

            echo "=== 记录回滚镜像 ==="
            CUR_ID=$(sudo docker inspect -f '{{.Image}}' "$CONTAINER" 2>/dev/null || true)
            if [ -n "$CUR_ID" ]; then
              sudo docker tag "$CUR_ID" jietingche:previous && echo "回滚镜像：jietingche:previous"
            else
              echo "无运行中的旧容器（首次部署）"
            fi
            sudo docker tag "$IMAGE" jietingche:latest

            echo "=== 换容器 ==="
            sudo docker stop "$CONTAINER" >/dev/null 2>&1 || true
            sudo docker rm "$CONTAINER" >/dev/null 2>&1 || true
            if ! run_container jietingche:latest; then
              echo "❌ 新容器启动失败"
              if sudo docker image inspect jietingche:previous >/dev/null 2>&1; then
                echo "回滚到 jietingche:previous"
                sudo docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
                run_container jietingche:previous || { echo "❌ 回滚也失败，需人工介入"; exit 1; }
              fi
              exit 1
            fi

            echo "=== 自检 ==="
            if ! wait_healthy "$CONTAINER"; then
              echo "❌ 新容器未通过探活，最近日志："
              sudo docker logs --tail 60 "$CONTAINER" || true
              echo "   回滚命令：sudo docker rm -f $CONTAINER && sudo docker run -d --name $CONTAINER ... jietingche:previous"
              exit 1
            fi

            echo "=== 清理悬空镜像（保留 latest / previous 便于回滚） ==="
            sudo docker image prune -f >/dev/null

            echo "=== 部署完成 ==="
            sudo docker ps | grep "$CONTAINER"

            # 宿主机端口自检：容器内探活过了，不代表 -p 映射和防火墙放行了
            echo "=== 宿主机端口自检（$APP_PORT -> 3000） ==="
            HOST_CODE=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "http://127.0.0.1:$APP_PORT/api/config" || echo "000")
            if [ "$HOST_CODE" = "200" ]; then
              echo "宿主机 $APP_PORT 对外映射正常"
            else
              echo "⚠️ 宿主机 $APP_PORT 返回 $HOST_CODE：映射或防火墙/安全组需人工确认"
              sudo docker port "$CONTAINER" || true
            fi

            # 落地页缓存护栏：SEO 三页必须始终可被 CDN 缓存。
            # 病根：页面一旦引入请求级依赖（cookies/searchParams），Next 会无声下发
            # private,no-store，CDN 缓存整个失效且没有任何报错，只有回源变慢。
            # 这里从首页→城市页→车场页逐级取真实链接，断言缓存头里有 s-maxage。
            echo "=== 落地页缓存头断言（防 no-store 回归） ==="
            CITY_ASSERT=$(curl -s -m 5 "http://127.0.0.1:$APP_PORT/" \
              | grep -o 'href="/city/[^"]*"' | head -1 | cut -d'"' -f2)
            PARK_ASSERT=$(curl -s -m 5 "http://127.0.0.1:$APP_PORT$CITY_ASSERT" \
              | grep -o 'href="/park/[^"]*"' | head -1 | cut -d'"' -f2)
            for p in "/" "$CITY_ASSERT" "$PARK_ASSERT"; do
              if [ -z "$p" ]; then
                echo "❌ 未能解析出落地页链接（首页没给 /city/ 或城市页没给 /park/）"
                exit 1
              fi
              cc=$(curl -s -o /dev/null -D - -m 5 "http://127.0.0.1:$APP_PORT$p" \
                | tr -d '\r' | grep -i '^cache-control:' | head -1)
              case "$cc" in
                *s-maxage*)
                  echo "✓ $p → $cc"
                  ;;
                *)
                  echo "❌ $p 缓存头不含 s-maxage：$cc（页面被改回动态渲染，CDN 会全量回源）"
                  exit 1
                  ;;
              esac
            done

            # 旧的 /opt/jietingche 已废弃（.env 与 uploads 都搬到 data/ 了），新容器确实在跑才删
            if [ "$LEGACY_SITE_DIR" != "$SITE_DIR" ] && sudo test -d "$LEGACY_SITE_DIR"; then
              echo "=== 清理旧站点目录 $LEGACY_SITE_DIR ==="
              sudo rm -rf "$LEGACY_SITE_DIR"
            fi
