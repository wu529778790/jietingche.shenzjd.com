name: H5 Build

# 静态包产线：快照 → 打包 zip（产物留档），xhs / toy 共用一套源。
# 送审不在这里做——redapp / toy 都要本机登录、还要人看预览，交给人工。
#
# 快照从哪来：本地跑 `npm run snapshot` 生成，再 `npm run snapshot:publish` 发成一个
# snapshot-* 的 GitHub Release；本 workflow 默认就下它的 jtc-snapshot.json 附件，
# 不需要配 secret。想临时换外部地址，填 snapshot_url 或配 secret SNAPSHOT_URL。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 打包目标（xhs 或 toy）
        required: false
        default: xhs
      snapshot_url:
        description: 快照 JSON 地址（留空用 secret SNAPSHOT_URL）
        required: false
      city:
        description: 打进包里的主城市
        required: false
        default: 深圳市

permissions:
  contents: read

jobs:
  build:
    name: 构建 H5 包
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 下载数据快照
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_URL: ${{ inputs.snapshot_url || secrets.SNAPSHOT_URL }}
        run: |
          mkdir -p data
          if [ -n "$SNAPSHOT_URL" ]; then
            echo "快照来源：$SNAPSHOT_URL"
            curl -fsSL "$SNAPSHOT_URL" -o data/jtc-snapshot.json
          else
            # 默认走最近的一个 snapshot-* Release（本机 npm run snapshot:publish 发的）
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
              --jq '[.[] | select(.tag_name | startswith("snapshot-"))][0].tag_name')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::没找到 snapshot-* 的 Release，先在本机跑 npm run snapshot:publish"
              exit 1
            fi
            echo "快照来源：Release $TAG"
            gh release download "$TAG" --pattern jtc-snapshot.json --output data/jtc-snapshot.json --clobber
          fi
          node -e "const s=require('./data/jtc-snapshot.json');console.log('快照', s.rows.length, '条套餐 /', s.cities.length, '个城市 /', s.generatedAt)"

      - name: 打包
        run: npm run "${{ inputs.target || 'xhs' }}" -- --snapshot data/jtc-snapshot.json --city "${{ inputs.city || '深圳市' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target || 'xhs' }}-zip
          path: |
            minitool/dist/*.zip
            platforms/toy/dist/*.zip
          retention-days: 30
