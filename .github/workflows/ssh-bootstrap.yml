name: SSH Bootstrap

# 一次性工具：用仓库里的 DEPLOY_* secret 把指定公钥追加到服务器 authorized_keys。
# 只在临时分支上存在，配好本机免密登录后即删除，不进 main。
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "要授权的公钥（整行）"
        required: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: 追加公钥到 authorized_keys
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            grep -qxF '${{ inputs.pubkey }}' ~/.ssh/authorized_keys || echo '${{ inputs.pubkey }}' >> ~/.ssh/authorized_keys
            echo "authorized: $(whoami)@$(hostname)"
            echo "total keys: $(wc -l < ~/.ssh/authorized_keys)"
