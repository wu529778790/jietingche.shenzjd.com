<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>泊月 · 附近停车月卡</title>
  <style>
    /* 官方模板全局重置（zip-artifact-spec §5，Chrome 61 基线） */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* 必须是 min-height：height:100% 会把 body 盒子钉成视口高，
       吸顶的 .toolbar（position:sticky）就只能在视口那一屏里吸，滚起来立刻被带走 */
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* 搜索框需要允许选中输入内容 */
    input { -webkit-user-select: text; user-select: text; }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 品牌头：对齐站点 HomeSearch 的渐变蓝卡 -->
  <section class="hero">
    <div class="hero-brand">
      <svg class="hero-pin" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
        <path fill="#ffffff" d="M64 14 c-19 0 -34 15 -34 33 c0 24 34 61 34 61 s34 -37 34 -61 c0 -18 -15 -33 -34 -33 Z"/>
        <path d="M54 75 V35 H66 a13 13 0 0 1 0 26 H54" fill="none" stroke="#0d3fb0"
              stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="hero-name">泊月</span>
      <span class="hero-tag">停车月卡，附近谁家最省</span>
    </div>
    <h1 class="hero-title">附近哪家能办停车月卡</h1>
    <div class="hero-sub">价格与时段一目了然，办理在停车场官方渠道完成</div>
    <div class="hero-search">
      <input id="kw" type="search" placeholder="搜车场名 / 地址，如：中心书城" autocomplete="off" />
    </div>
  </section>

  <!-- 吸顶筛选条：位置 / 筛选 / 排序挤一行，条件进面板里选（对齐站点 filter-pill 条） -->
  <section class="toolbar" id="toolbar">
    <button id="btnLoc" class="filter-pill shrink" type="button">位置</button>
    <button id="btnFilter" class="filter-pill" type="button">筛选<span id="filterBadge" class="badge" hidden></span></button>
    <button id="sortRec" class="filter-pill on" type="button">推荐</button>
    <button id="sortDist" class="filter-pill dim" type="button">离我最近</button>
    <button id="sortPrice" class="filter-pill" type="button">价格优先</button>
    <button id="btnReset" class="filter-pill shrink" type="button" hidden>清空</button>
  </section>

  <div id="notice" class="notice" hidden></div>
  <div id="geoRetry" class="geo-retry" hidden>定位没有成功，点这里重新定位</div>

  <main id="list" class="list"></main>
  <div id="sentinel"></div>
  <div id="noMore" class="no-more" hidden>没有更多了</div>

  <footer class="ft">
    <button id="btnShare" class="ft-share" type="button" hidden>分享给朋友</button>
    数据更新 <span id="upd"></span> · 价格与规则以官方页为准
  </footer>

  <!-- 定位引导浮层：官方要求定位由用户手势触发，进页面时引导点一下再定位 -->
  <div id="geoPanel" class="mask geo-mask" hidden>
    <div class="geo-card">
      <div class="geo-title">开启定位</div>
      <div id="geoDesc" class="geo-desc">按你的位置推荐附近能办月卡的车场，远近一目了然</div>
      <button id="geoOk" class="btn-primary block-btn" type="button">开启定位</button>
    </div>
  </div>

  <!-- 位置弹层（对齐 LocationSheet：当前位置 + 城市 + 区域） -->
  <div id="lpanel" class="mask" hidden>
    <div class="sheet">
      <div class="sheet-hd">
        <div class="sheet-title">选择位置</div>
        <button id="lClose" class="sh-close" type="button">关闭</button>
      </div>
      <div class="sheet-body">
        <button id="useGeo" class="geo-btn" type="button">使用当前位置，看最近的车场</button>
        <div class="fsec">
          <div class="fsec-title">城市</div>
          <div class="city-search"><input id="cityKw" type="search" placeholder="搜城市名，如：广州" autocomplete="off" /></div>
          <div id="cityBody"></div>
        </div>
        <div class="fsec" id="distSec" hidden>
          <div class="fsec-title">区域<span class="fsec-note">（先选城市，再选区域）</span></div>
          <div id="distBody" class="fgrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 筛选弹层（对齐 FilterSheet：业态 / 类型 / 时段 / 价格上限，确定才生效） -->
  <div id="fpanel" class="mask" hidden>
    <div class="sheet">
      <div class="sheet-hd">
        <div class="sheet-title">筛选</div>
        <button id="fClose" class="sh-close" type="button">关闭</button>
      </div>
      <div class="sheet-body"><div id="fbody"></div></div>
      <div class="fbtns">
        <button id="fReset" class="btn-ghost flex1" type="button">重置</button>
        <button id="fApply" class="btn-primary flex1" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- 出码弹层（对齐 PackageSheet：先价格后码，保存到相册是小工具特有入口） -->
  <div id="sheet" class="mask" hidden>
    <div class="sheet">
      <div class="sheet-hd">
        <div class="min-w0">
          <div id="shPark" class="sh-park"></div>
          <div id="shAddrTop" class="sh-addr-top" hidden></div>
          <div id="shDist" class="sh-dist" hidden></div>
        </div>
        <button id="shClose" class="sh-close" type="button">关闭</button>
      </div>
      <div id="shPkg" class="sh-price-row"></div>
      <div id="shRule" class="sh-rule-top" hidden></div>
      <!-- 凭证图只在非小红书容器渲染（B 站 Toy / 浏览器要能直接扫）；小红书机审红线，见 app.js -->
      <div id="shQr" class="sh-qr" hidden>
        <img id="shQrImg" alt="办理凭证" />
      </div>
      <button id="shSave" class="btn-primary block-btn" type="button">保存办理凭证到相册</button>
      <div id="shTip" class="sh-tip"></div>
      <div id="shGuide" class="sh-guide"></div>
      <div class="sh-foot">价格与规则以官方页面为准，下单前请确认出场时间限制</div>
    </div>
  </div>

  <!-- 环境诊断（隐藏）：连点品牌头 5 次打开。Toy 没有控制台也没有远程调试，
       平台到底下放了哪些能力只能靠它真机自证（定位这条尤其） -->
  <div id="diag" class="mask" hidden>
    <div class="sheet diag-sheet">
      <div class="sheet-hd">
        <div class="sheet-title">环境诊断</div>
        <button id="diagClose" class="sh-close" type="button">关闭</button>
      </div>
      <pre id="diagBody" class="diag-body">检测中…</pre>
      <div class="fbtns">
        <button id="diagAgain" class="btn-ghost flex1" type="button">重新检测</button>
        <button id="diagSelect" class="btn-primary flex1" type="button">全选结果</button>
      </div>
    </div>
  </div>

  <script src="./shared.js"></script>
  <script src="./qr-encoder.js"></script>
  <script src="./qr-data.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
