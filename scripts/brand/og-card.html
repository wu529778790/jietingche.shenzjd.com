<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>泊月 · 品牌出图（OG / apple-icon）</title>
<!--
  出图源文件 / 预览页。

    node scripts/brand/render-og.mjs      → public/og.png（1200×630，从本文件的 #og 区块生成）
    node scripts/brand/render-icons.mjs   → public/icons/icon-192|512|maskable-512.png
                                            + src/app/apple-icon.png（纯 SVG 渲染，不经过本文件）

  本文件里的 #apple / #pwa192 / #pwa512 / #maskable 只作视觉预览。
  换机器上跑不了 render-og.mjs（缺 Chromium）时，浏览器打开本文件，
  在 DevTools 里对 #og 右键「Capture node screenshot」也能出图。

  图形有两套参数，改动要一起同步：
    · src/app/icon.svg          r=30 / stroke=10，favicon 用（小一号的针 + 细 P）
    · src/components/BrandMark.tsx  r=34 / stroke=12，页面内联 / 图标 / 分享图用
    · src/proxy.ts              离线页内联副本（蓝针白 P 反色）
    · 本文件                    5 处内联副本（第 2 套参数）
  改完再跑上面两个 render 脚本重出图片。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: -apple-system, "PingFang SC", sans-serif; }

  /* iOS 桌面图标：正方形铺满，圆角交给系统 */
  #apple {
    width: 180px; height: 180px;
    background: linear-gradient(135deg, #1b6bff 0%, #0d3fb0 100%);
    display: flex; align-items: center; justify-content: center;
  }
  #apple svg { width: 118px; height: 118px; }

  /* PWA 图标：满方铺底，形状交给系统遮罩；maskable 把针缩进安全区 */
  .tile {
    background: linear-gradient(135deg, #1b6bff 0%, #0d3fb0 100%);
    display: flex; align-items: center; justify-content: center;
  }
  #pwa192 { width: 192px; height: 192px; }
  #pwa512 { width: 512px; height: 512px; }
  #maskable { width: 512px; height: 512px; }
  #pwa192 svg { width: 127px; height: 127px; }
  #pwa512 svg { width: 338px; height: 338px; }
  #maskable svg { width: 266px; height: 266px; }

  #og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1b6bff 0%, #0d3fb0 100%);
    color: #fff; display: flex; flex-direction: column; justify-content: center;
    padding: 0 88px;
  }
  #og .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 44px; }
  #og .brand svg { width: 76px; height: 76px; flex: none; }
  #og .brand .nm { font-size: 52px; font-weight: 800; letter-spacing: 3px; line-height: 1; }
  #og .brand .tg { font-size: 21px; color: rgba(255,255,255,.72); margin-top: 10px; letter-spacing: 1px; }
  #og h1 { font-size: 58px; line-height: 1.26; font-weight: 800; letter-spacing: 1px; }
  #og p { margin-top: 26px; font-size: 26px; color: rgba(255,255,255,.8); letter-spacing: .5px; }
  #og .domain {
    position: absolute; left: 88px; bottom: 48px;
    font-size: 21px; color: rgba(255,255,255,.55); letter-spacing: 1px;
  }
  #og .rule {
    position: absolute; right: -140px; top: -140px; width: 520px; height: 520px;
    border: 2px solid rgba(255,255,255,.13); border-radius: 50%;
  }
  #og .rule2 {
    position: absolute; right: 30px; bottom: -200px; width: 380px; height: 380px;
    border: 2px solid rgba(255,255,255,.1); border-radius: 50%;
  }
</style>
</head>
<body>
  <div id="apple">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <path fill="#ffffff" d="M64 14 c-19 0 -34 15 -34 33 c0 24 34 61 34 61 s34 -37 34 -61 c0 -18 -15 -33 -34 -33 Z"/>
      <path d="M54 75 V35 H66 a13 13 0 0 1 0 26 H54" fill="none" stroke="#0d3fb0"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="pwa192" class="tile">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <path fill="#ffffff" d="M64 14 c-19 0 -34 15 -34 33 c0 24 34 61 34 61 s34 -37 34 -61 c0 -18 -15 -33 -34 -33 Z"/>
      <path d="M54 75 V35 H66 a13 13 0 0 1 0 26 H54" fill="none" stroke="#0d3fb0"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="pwa512" class="tile">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <path fill="#ffffff" d="M64 14 c-19 0 -34 15 -34 33 c0 24 34 61 34 61 s34 -37 34 -61 c0 -18 -15 -33 -34 -33 Z"/>
      <path d="M54 75 V35 H66 a13 13 0 0 1 0 26 H54" fill="none" stroke="#0d3fb0"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="maskable" class="tile">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <path fill="#ffffff" d="M64 14 c-19 0 -34 15 -34 33 c0 24 34 61 34 61 s34 -37 34 -61 c0 -18 -15 -33 -34 -33 Z"/>
      <path d="M54 75 V35 H66 a13 13 0 0 1 0 26 H54" fill="none" stroke="#0d3fb0"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="og">
    <div class="rule"></div>
    <div class="rule2"></div>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
        <path fill="#ffffff" d="M64 14 c-19 0 -34 15 -34 33 c0 24 34 61 34 61 s34 -37 34 -61 c0 -18 -15 -33 -34 -33 Z"/>
        <path d="M54 75 V35 H66 a13 13 0 0 1 0 26 H54" fill="none" stroke="#0d3fb0"
          stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="nm">泊月</div>
        <div class="tg">停车月卡 · 附近谁家最省</div>
      </div>
    </div>
    <h1>附近哪家能办停车月卡，<br/>谁家最省一目了然</h1>
    <p>全国 8000+ 车场 · 月卡 / 季卡 / 夜间包月 · 扫码在官方小程序办理</p>
    <div class="domain">jietingche.shenzjd.com</div>
  </div>
</body>
</html>
